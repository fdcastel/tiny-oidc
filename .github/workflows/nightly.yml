# Nightly gates against staging (spec §13.9, §13.10, §13.1 mutation). Staging is
# reached over HTTPS only; the URL and the admin credential for the conformance
# and load runners are repository secrets set by the owner. No Cloudflare API
# token exists in GitHub (TIO-DEPLOY-006). The jobs are enabled by the
# repository variable NIGHTLY_ENABLED=true once Phase 7 wires them (P7-03, P7-04, P7-07).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # nightly: conformance, load, mutation
    - cron: "17 5 * * 0" # weekly: the soak
  workflow_dispatch:
    inputs:
      only:
        description: Run one job instead of the nightly set (iterating on a gate)
        type: choice
        options: [all, conformance, load, mutation]
        default: all
      soak:
        description: Also run the two-hour soak
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conformance:
    # The OpenID Foundation conformance suite against staging (spec §13.9):
    # the suite runs here from its prebuilt images, exposed to the OP through
    # a cloudflared quick tunnel (the OP must reach the suite's back-channel
    # logout endpoint), and conformance/run.ts registers the suite's relying
    # parties on staging, renders the plans and drives the suite's own
    # scripts/run-test-plan.py. The exported results are the archive
    # TIO-TEST-040 asks for.
    name: OpenID conformance suite (TIO-TEST-040, TIO-TEST-041)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && github.event.schedule != '17 5 * * 0' && (!inputs.only || inputs.only == 'all' || inputs.only == 'conformance') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TIO_STAGING_ISSUER: ${{ secrets.TIO_STAGING_ISSUER }}
      TIO_STAGING_LOGIN_URL: ${{ secrets.TIO_STAGING_LOGIN_URL }}
      TIO_STAGING_CLIENT_ID: ${{ secrets.TIO_STAGING_CLIENT_ID }}
      TIO_STAGING_CLIENT_SECRET: ${{ secrets.TIO_STAGING_CLIENT_SECRET }}
      TIO_STAGING_UPSTREAM_ALIAS: ${{ vars.TIO_STAGING_UPSTREAM_ALIAS || 'fake' }}
      IMAGE_TAG: ${{ vars.CONFORMANCE_IMAGE_TAG || 'latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout the suite's runner scripts
        uses: actions/checkout@v5
        with:
          repository: openid-certification/conformance-suite
          ref: ${{ vars.CONFORMANCE_SUITE_REF || 'master' }}
          path: conformance/suite
          sparse-checkout: scripts
      - name: Python dependencies of run-test-plan.py
        run: python3 -m pip install --quiet httpx pyparsing
      - name: Public URL for the suite (cloudflared quick tunnel)
        id: tunnel
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --url https://localhost:8443 --no-tls-verify > conformance/results-tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' conformance/results-tunnel.log | head -1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          if [ -z "$url" ]; then echo "::error::no tunnel URL"; cat conformance/results-tunnel.log; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "suite reachable at $url"
      - name: Start the suite
        env:
          BASE_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          docker compose -f conformance/docker-compose.yml pull --quiet
          docker compose -f conformance/docker-compose.yml up -d
          for i in $(seq 1 90); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' 'https://localhost:8443/api/plan?length=1' || true)
            if [ "$code" = "200" ]; then echo ready; exit 0; fi
            sleep 5
          done
          echo "::error::the suite did not come up"; docker compose -f conformance/docker-compose.yml logs server | tail -100; exit 1
      - name: Run the plans (TIO-TEST-040, TIO-TEST-041)
        run: node conformance/run.ts --suite-scripts conformance/suite/scripts --public-url "${{ steps.tunnel.outputs.url }}"
      - name: Suite logs
        if: always()
        run: |
          mkdir -p conformance/results
          docker compose -f conformance/docker-compose.yml logs --no-color server > conformance/results/server.log 2>&1 || true
          docker compose -f conformance/docker-compose.yml down -v || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/results/export/
            conformance/results/config/
            conformance/results/expected-failures.json
            conformance/results/expected-skips.json
            conformance/results/server.log
          retention-days: 90

  load:
    # The load gates against staging (spec §13.10): the population is imported
    # once (the benchmark of TIO-ADMIN-021; later nights find it and skip), a
    # fresh 100,000 tokens are harvested every night (TIO-TEST-050), then the
    # k6 scenarios run with the §2.7 budgets as thresholds (TIO-PERF-001,
    # TIO-TEST-051). The secrets are the staging issuer, its login app, the
    # automation client granted the admin scope, and the fake upstream's
    # credentials — never a Cloudflare token (TIO-DEPLOY-006). The harvested
    # tokens never leave the runner; only reports and summaries are archived.
    name: k6 load thresholds (TIO-PERF-001, TIO-TEST-050, TIO-TEST-051)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && github.event.schedule != '17 5 * * 0' && (!inputs.only || inputs.only == 'all' || inputs.only == 'load') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TIO_PERF_ISSUER: ${{ secrets.TIO_STAGING_ISSUER }}
      TIO_PERF_LOGIN_URL: ${{ secrets.TIO_STAGING_LOGIN_URL }}
      TIO_PERF_CLIENT_ID: ${{ secrets.TIO_STAGING_CLIENT_ID }}
      TIO_PERF_CLIENT_SECRET: ${{ secrets.TIO_STAGING_CLIENT_SECRET }}
      TIO_FAKE_ISSUER: ${{ secrets.TIO_STAGING_FAKE_ISSUER }}
      TIO_FAKE_CLIENT_ID: ${{ secrets.TIO_STAGING_FAKE_CLIENT_ID }}
      TIO_FAKE_CLIENT_SECRET: ${{ secrets.TIO_STAGING_FAKE_CLIENT_SECRET }}
      TIO_PERF_SEED: ${{ vars.TIO_PERF_SEED || '1' }}
      TIO_PERF_USERS: ${{ vars.TIO_PERF_USERS || '1000000' }}
      TIO_PERF_HARVEST: ${{ vars.TIO_PERF_HARVEST || '100000' }}
      TIO_PERF_DURATION: ${{ vars.TIO_PERF_DURATION || '5m' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: grafana/setup-k6-action@v1
      - name: Prepare staging (settings, group, fake upstream, relying parties)
        run: node perf/seed.ts prepare --groups staff
      # The population is re-created every night from this runner: a Durable Object lives where
      # its first request entered Cloudflare, and a population created by another night's runner
      # (another region) puts a cross-colo round trip into every object call it measures.
      - name: Delete last night's population
        run: node perf/seed.ts delete --users "$TIO_PERF_USERS"
      - name: Import the population (TIO-ADMIN-021 benchmark)
        run: node perf/seed.ts import --users "$TIO_PERF_USERS" --groups staff --report perf/data/import-benchmark.json
      - name: Harvest the tokens (TIO-TEST-050)
        run: node perf/seed.ts harvest --count "$TIO_PERF_HARVEST" --rate 50 --report perf/data/harvest.json
      - name: k6 scenarios with the §2.7 thresholds (TIO-PERF-001, TIO-TEST-051)
        run: |
          set -o pipefail
          status=0
          run() {
            name=$1; shift
            echo "::group::$name"
            TIO_PERF_SUMMARY="perf/data/$name.summary.json" k6 run "$@" "perf/scenarios/$name.js" || status=1
            echo "::endgroup::"
          }
          run discovery
          run sso_authorize
          run login_federated
          run token_code_exchange
          run admin_list
          # Refresh-rotating scenarios get disjoint slices of the population (see perf/scenarios/lib.js).
          TIO_PERF_SLICE="0:$((TIO_PERF_HARVEST * 6 / 10))" run token_refresh
          TIO_PERF_SLICE="$((TIO_PERF_HARVEST * 99 / 100)):$TIO_PERF_HARVEST" run userinfo
          exit $status
      - name: Load summary
        if: always()
        run: node scripts/load-summary.ts perf/data >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-reports
          path: |
            perf/data/*.json
            !perf/data/tokens.ndjson
          retention-days: 90

  soak:
    # TIO-TEST-052: the refresh scenario for two hours at 100/s, weekly, on
    # tokens harvested by the job itself (a fresh runner, so no slice is needed).
    name: soak (TIO-TEST-052)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && (github.event.schedule == '17 5 * * 0' || inputs.soak == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TIO_PERF_ISSUER: ${{ secrets.TIO_STAGING_ISSUER }}
      TIO_PERF_LOGIN_URL: ${{ secrets.TIO_STAGING_LOGIN_URL }}
      TIO_PERF_CLIENT_ID: ${{ secrets.TIO_STAGING_CLIENT_ID }}
      TIO_PERF_CLIENT_SECRET: ${{ secrets.TIO_STAGING_CLIENT_SECRET }}
      TIO_PERF_SEED: ${{ vars.TIO_PERF_SEED || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: grafana/setup-k6-action@v1
      - name: Harvest the soak's tokens
        run: node perf/seed.ts harvest --count 40000 --rate 50 --report perf/data/soak-harvest.json
      - name: k6 soak_refresh (2 h at 100/s)
        run: TIO_PERF_SUMMARY=perf/data/soak_refresh.summary.json k6 run perf/scenarios/soak_refresh.js
      - name: Load summary
        if: always()
        run: node scripts/load-summary.ts perf/data >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-reports
          path: |
            perf/data/*.json
            !perf/data/tokens.ndjson
          retention-days: 90

  mutation:
    # Stryker over the Node unit project (spec §13.1): report only, never a gate.
    # The Workers project stays out until the Vitest runner stops pinning
    # pool=threads, which displaces the Cloudflare pool (stryker.config.json).
    name: mutation testing baseline (report only)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && github.event.schedule != '17 5 * * 0' && (!inputs.only || inputs.only == 'all' || inputs.only == 'mutation') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:types
      - name: Stryker (unit project)
        run: pnpm mutate
      - name: Mutation score
        if: always()
        run: node scripts/mutation-summary.ts reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
