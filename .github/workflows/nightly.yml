# Nightly gates against staging (spec §13.9, §13.10, §13.1 mutation). Staging is
# reached over HTTPS only; the URL and the admin credential for the conformance
# and load runners are repository secrets set by the owner. No Cloudflare API
# token exists in GitHub (TIO-DEPLOY-006). The jobs are enabled by the
# repository variable NIGHTLY_ENABLED=true once Phase 7 wires them (P7-03, P7-04, P7-07).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # nightly: conformance, load, mutation
    - cron: "17 5 * * 0" # weekly: the soak
  workflow_dispatch:
    inputs:
      soak:
        description: Also run the two-hour soak
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conformance:
    name: OpenID conformance suite (TIO-TEST-040, TIO-TEST-041)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && github.event.schedule != '17 5 * * 0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the conformance plans against staging
        run: echo "conformance runner lands in P7-03" && exit 1

  load:
    # The load gates against staging (spec §13.10): the population is imported
    # once (the benchmark of TIO-ADMIN-021; later nights find it and skip), a
    # fresh 100,000 tokens are harvested every night (TIO-TEST-050), then the
    # k6 scenarios run with the §2.7 budgets as thresholds (TIO-PERF-001,
    # TIO-TEST-051). The secrets are the staging issuer, its login app, the
    # automation client granted the admin scope, and the fake upstream's
    # credentials — never a Cloudflare token (TIO-DEPLOY-006). The harvested
    # tokens never leave the runner; only reports and summaries are archived.
    name: k6 load thresholds (TIO-PERF-001, TIO-TEST-050, TIO-TEST-051)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && github.event.schedule != '17 5 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TIO_PERF_ISSUER: ${{ secrets.TIO_STAGING_ISSUER }}
      TIO_PERF_LOGIN_URL: ${{ secrets.TIO_STAGING_LOGIN_URL }}
      TIO_PERF_CLIENT_ID: ${{ secrets.TIO_STAGING_CLIENT_ID }}
      TIO_PERF_CLIENT_SECRET: ${{ secrets.TIO_STAGING_CLIENT_SECRET }}
      TIO_FAKE_ISSUER: ${{ secrets.TIO_STAGING_FAKE_ISSUER }}
      TIO_FAKE_CLIENT_ID: ${{ secrets.TIO_STAGING_FAKE_CLIENT_ID }}
      TIO_FAKE_CLIENT_SECRET: ${{ secrets.TIO_STAGING_FAKE_CLIENT_SECRET }}
      TIO_PERF_SEED: ${{ vars.TIO_PERF_SEED || '1' }}
      TIO_PERF_USERS: ${{ vars.TIO_PERF_USERS || '1000000' }}
      TIO_PERF_HARVEST: ${{ vars.TIO_PERF_HARVEST || '100000' }}
      TIO_PERF_DURATION: ${{ vars.TIO_PERF_DURATION || '5m' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: grafana/setup-k6-action@v1
      - name: Prepare staging (settings, group, fake upstream, relying parties)
        run: node perf/seed.ts prepare --groups staff
      - name: Import the population unless it is already there (TIO-ADMIN-021 benchmark on the first night)
        run: node perf/seed.ts import --users "$TIO_PERF_USERS" --groups staff --skip-if-seeded --report perf/data/import-benchmark.json
      - name: Harvest the tokens (TIO-TEST-050)
        run: node perf/seed.ts harvest --count "$TIO_PERF_HARVEST" --rate 50 --report perf/data/harvest.json
      - name: k6 scenarios with the §2.7 thresholds (TIO-PERF-001, TIO-TEST-051)
        run: |
          set -o pipefail
          status=0
          run() {
            name=$1; shift
            echo "::group::$name"
            TIO_PERF_SUMMARY="perf/data/$name.summary.json" k6 run "$@" "perf/scenarios/$name.js" || status=1
            echo "::endgroup::"
          }
          run discovery
          run sso_authorize
          run login_federated
          run token_code_exchange
          run admin_list
          # Refresh-rotating scenarios get disjoint slices of the population (see perf/scenarios/lib.js).
          TIO_PERF_SLICE="0:$((TIO_PERF_HARVEST * 6 / 10))" run token_refresh
          TIO_PERF_SLICE="$((TIO_PERF_HARVEST * 99 / 100)):$TIO_PERF_HARVEST" run userinfo
          exit $status
      - name: Load summary
        if: always()
        run: node scripts/load-summary.ts perf/data >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-reports
          path: |
            perf/data/*.json
            !perf/data/tokens.ndjson
          retention-days: 90

  soak:
    # TIO-TEST-052: the refresh scenario for two hours at 100/s, weekly, on
    # tokens harvested by the job itself (a fresh runner, so no slice is needed).
    name: soak (TIO-TEST-052)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && (github.event.schedule == '17 5 * * 0' || inputs.soak == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TIO_PERF_ISSUER: ${{ secrets.TIO_STAGING_ISSUER }}
      TIO_PERF_LOGIN_URL: ${{ secrets.TIO_STAGING_LOGIN_URL }}
      TIO_PERF_CLIENT_ID: ${{ secrets.TIO_STAGING_CLIENT_ID }}
      TIO_PERF_CLIENT_SECRET: ${{ secrets.TIO_STAGING_CLIENT_SECRET }}
      TIO_PERF_SEED: ${{ vars.TIO_PERF_SEED || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: grafana/setup-k6-action@v1
      - name: Harvest the soak's tokens
        run: node perf/seed.ts harvest --count 40000 --rate 50 --report perf/data/soak-harvest.json
      - name: k6 soak_refresh (2 h at 100/s)
        run: TIO_PERF_SUMMARY=perf/data/soak_refresh.summary.json k6 run perf/scenarios/soak_refresh.js
      - name: Load summary
        if: always()
        run: node scripts/load-summary.ts perf/data >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-reports
          path: |
            perf/data/*.json
            !perf/data/tokens.ndjson
          retention-days: 90

  mutation:
    # Stryker over the Node unit project (spec §13.1): report only, never a gate.
    # The Workers project stays out until the Vitest runner stops pinning
    # pool=threads, which displaces the Cloudflare pool (stryker.config.json).
    name: mutation testing baseline (report only)
    if: ${{ vars.NIGHTLY_ENABLED == 'true' && github.event.schedule != '17 5 * * 0' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:types
      - name: Stryker (unit project)
        run: pnpm mutate
      - name: Mutation score
        if: always()
        run: node scripts/mutation-summary.ts reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
